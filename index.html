<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budget Allowance Advisor</title>
  <style>
    :root { --bg: #f0f4f8; --surface: #ffffff; --primary: #3b6ea5; --primary-light: #e8f0fb; --danger: #d94040; --danger-light: #fde8e8; --warning: #e07b2a; --warning-light: #fef3e2; --success: #2e9e6b; --success-light: #e2f5ed; --text: #1e2a38; --text-muted: #6b7d93; --border: #d8e2ec; --radius: 12px; --shadow: 0 2px 8px rgba(30,42,56,0.08); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 16px; }
    .container { max-width: 960px; margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    header h1 { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
    .header-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .month-select { padding: 8px 12px; border: 1.5px solid var(--border); border-radius: var(--radius); font-size: 0.95rem; background: var(--surface); color: var(--text); cursor: pointer; }
    .btn { padding: 8px 14px; border-radius: var(--radius); font-size: 0.88rem; font-weight: 600; cursor: pointer; border: none; transition: opacity 0.15s; }
    .btn:hover { opacity: 0.85; }
    .btn-ghost { background: transparent; color: var(--text-muted); border: 1.5px solid var(--border); }
    .btn-ghost:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
    .allowance-banner { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 20px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .allowance-banner label { font-weight: 600; white-space: nowrap; color: var(--text-muted); font-size: 0.9rem; }
    .allowance-banner input { padding: 8px 12px; border: 1.5px solid var(--border); border-radius: var(--radius); font-size: 1rem; width: 150px; background: var(--bg); color: var(--text); }
    .allowance-banner input:focus { outline: none; border-color: var(--primary); }
    .allowance-set-btn { padding: 8px 16px; background: var(--primary); color: #fff; border: none; border-radius: var(--radius); font-weight: 600; cursor: pointer; font-size: 0.9rem; }
    .allowance-set-btn:hover { opacity: 0.85; }
    .allowance-hint { font-size: 0.8rem; color: var(--text-muted); margin-left: auto; }
    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .summary-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; }
    .summary-card .label { font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; margin-bottom: 6px; }
    .summary-card .value { font-size: 1.7rem; font-weight: 700; }
    .summary-card .sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; }
    .summary-card.danger .value { color: var(--danger); }
    .summary-card.success .value { color: var(--success); }
    .summary-card.warning .value { color: var(--warning); }
    .advice-container { margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
    .advice-card { border-radius: var(--radius); padding: 14px 18px; font-size: 0.92rem; font-weight: 500; display: flex; align-items: flex-start; gap: 10px; border-left: 4px solid; }
    .advice-card .icon { font-size: 1.2rem; flex-shrink: 0; }
    .advice-card.danger { background: var(--danger-light); border-color: var(--danger); color: #8b1a1a; }
    .advice-card.warning { background: var(--warning-light); border-color: var(--warning); color: #7a4a10; }
    .advice-card.success { background: var(--success-light); border-color: var(--success); color: #1a6040; }
    .advice-card.info { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
    .main-grid { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }
    @media (max-width: 768px) { .main-grid { grid-template-columns: 1fr; } }
    .section-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 20px; }
    .section-card h2 { font-size: 1rem; font-weight: 700; margin-bottom: 16px; color: var(--text); }
    .category-list { display: flex; flex-direction: column; gap: 14px; }
    .category-row { display: flex; flex-direction: column; gap: 6px; }
    .category-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .category-name { font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; gap: 6px; }
    .category-amounts { font-size: 0.8rem; color: var(--text-muted); text-align: right; }
    .category-amounts span { font-weight: 700; }
    .category-amounts .over { color: var(--danger); }
    .category-amounts .near { color: var(--warning); }
    .progress-track { height: 8px; background: var(--bg); border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 99px; transition: width 0.4s ease; min-width: 0; }
    .progress-fill.ok { background: var(--success); }
    .progress-fill.near { background: var(--warning); }
    .progress-fill.over { background: var(--danger); }
    .category-budget-input { width: 100px; padding: 5px 8px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 0.85rem; text-align: right; background: var(--bg); color: var(--text); flex-shrink: 0; }
    .category-budget-input:focus { outline: none; border-color: var(--primary); }
    .expense-form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .expense-form.full { grid-column: 1 / -1; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }
    .form-group input, .form-group select, .form-group textarea { padding: 9px 12px; border: 1.5px solid var(--border); border-radius: var(--radius); font-size: 0.9rem; background: var(--bg); color: var(--text); font-family: inherit; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); }
    .form-group textarea { resize: vertical; min-height: 60px; }
    .expense-form .add-btn { grid-column: 1 / -1; padding: 11px; background: var(--primary); color: #fff; border: none; border-radius: var(--radius); font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: opacity 0.15s; }
    .expense-form .add-btn:hover { opacity: 0.85; }
    .expense-list { display: flex; flex-direction: column; gap: 8px; max-height: 500px; overflow-y: auto; }
    .expense-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--bg); border-radius: 10px; gap: 10px; }
    .expense-item .info { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
    .expense-item .cat { font-weight: 600; font-size: 0.88rem; display: flex; align-items: center; gap: 5px; }
    .expense-item .note { font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
    .expense-item .date { font-size: 0.75rem; color: var(--text-muted); }
    .expense-item .amount { font-weight: 700; font-size: 0.95rem; color: var(--danger); white-space: nowrap; }
    .expense-item .delete-btn { padding: 5px 10px; background: transparent; border: 1.5px solid var(--border); border-radius: 8px; color: var(--text-muted); cursor: pointer; font-size: 0.78rem; font-weight: 600; transition: all 0.15s; white-space: nowrap; flex-shrink: 0; }
    .expense-item .delete-btn:hover { background: var(--danger-light); color: var(--danger); border-color: var(--danger); }
    .empty-state { text-align: center; color: var(--text-muted); padding: 24px; font-size: 0.9rem; }
    .sidebar { display: flex; flex-direction: column; gap: 20px; }
    .reset-section { text-align: center; margin-top: 12px; }
    .reset-btn { padding: 9px 20px; background: transparent; border: 1.5px solid var(--border); border-radius: var(--radius); color: var(--text-muted); cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: all 0.15s; }
    .reset-btn:hover { background: var(--danger-light); color: var(--danger); border-color: var(--danger); }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>Budget Allowance Advisor</h1>
    <div class="header-controls">
      <select class="month-select" id="monthSelect"></select>
      <button class="btn btn-ghost" id="exportBtn">Export</button>
      <button class="btn btn-ghost" id="importBtn">Import</button>
      <input type="file" id="importFile" accept=".json" style="display:none" />
    </div>
  </header>

  <div class="allowance-banner">
    <label for="allowanceInput">Monthly allowance</label>
    <input type="number" id="allowanceInput" placeholder="e.g. 2000" min="0" step="0.01" />
    <button class="allowance-set-btn" id="setAllowanceBtn">Set</button>
    <span class="allowance-hint" id="allowanceHint">Set your total monthly budget</span>
  </div>

  <div class="summary-grid">
    <div class="summary-card" id="cardSpent">
      <div class="label">Total spent</div>
      <div class="value" id="totalSpent">0.00</div>
      <div class="sub" id="spentSub">Across all categories</div>
    </div>
    <div class="summary-card" id="cardLeft">
      <div class="label">Left this month</div>
      <div class="value" id="moneyLeft">0.00</div>
      <div class="sub" id="leftSub">Based on your allowance</div>
    </div>
    <div class="summary-card" id="cardDaily">
      <div class="label">Safe to spend daily</div>
      <div class="value" id="dailySpend">0.00</div>
      <div class="sub" id="dailySub">Days left this month</div>
    </div>
    <div class="summary-card" id="cardProjected">
      <div class="label">Projected month-end</div>
      <div class="value" id="projected">0.00</div>
      <div class="sub" id="projectedSub">Based on today's pace</div>
    </div>
  </div>

  <div class="advice-container" id="adviceContainer"></div>

  <div class="main-grid">
    <div>
      <div class="section-card">
        <h2>Category Budgets</h2>
        <div class="category-list" id="categoryList"></div>
      </div>
      <div class="section-card">
        <h2>Add Expense</h2>
        <form class="expense-form" id="expenseForm">
          <div class="form-group">
            <label for="expenseCategory">Category</label>
            <select id="expenseCategory"></select>
          </div>
          <div class="form-group">
            <label for="expenseAmount">Amount</label>
            <input type="number" id="expenseAmount" placeholder="0.00" min="0" step="0.01" required />
          </div>
          <div class="form-group">
            <label for="expenseDate">Date</label>
            <input type="date" id="expenseDate" required />
          </div>
          <div class="form-group full">
            <label for="expenseNote">Note (optional)</label>
            <textarea id="expenseNote" placeholder="What was this for?"></textarea>
          </div>
          <button type="submit" class="add-btn">Add Expense</button>
        </form>
      </div>
    </div>
    <div class="sidebar">
      <div class="section-card">
        <h2>Recent Expenses</h2>
        <div class="expense-list" id="expenseList"></div>
        <div class="reset-section">
          <button class="reset-btn" id="resetBtn">Clear All Data</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
